<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' sfx: blob:; connect-src sfx:; img-src 'self' data: https:; frame-src https: http:; style-src 'self' 'unsafe-inline'">
<title>SFX Library</title>
<script src="boot.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="titlebar">
  <span class="logo" data-icon="wave"></span><span class="name">SFX Library</span><span class="sub" id="ver"></span>
  <button class="btn primary" id="updateBtn" hidden></button>
  <div class="tb-right">
    <button class="ibtn tb" id="premiereBtn" data-icon="film"></button>
    <button class="ibtn tb" id="themeBtn"></button>
    <select id="lang" data-i18n-title="language"><option value="auto" data-i18n="langAuto"></option><option value="ru">RU</option><option value="en">EN</option></select>
  </div>
</header>

<aside id="side">
  <div class="side-scroll">
    <div id="nav">
      <div class="item" data-view="all"><span class="tw"></span><span class="ic" data-icon="wave"></span><span class="lbl" data-i18n="allSounds"></span></div>
      <div class="item" data-view="fav"><span class="tw"></span><span class="ic" data-icon="star"></span><span class="lbl" data-i18n="favorites"></span></div>
      <div class="item" data-view="net"><span class="tw"></span><span class="ic" data-icon="globe"></span><span class="lbl" data-i18n="netNav"></span></div>
    </div>
    <div class="ph"><span data-i18n="libraries"></span><span class="ph-btns">
      <button class="ibtn sm" id="rescan" data-i18n-title="rescanAll" data-icon="refresh"></button>
      <button class="ibtn sm" id="add" data-i18n-title="addFolder" data-icon="plus"></button></span></div>
    <div id="libs"></div>
  </div>
  <!-- accounts: which sound sites are connected; signing in opens the site's own login in a small window -->
  <div id="accountsBox">
    <div class="ph"><span data-i18n="accounts"></span></div>
    <div id="accounts"></div>
  </div>
  <div id="scanStatus"></div>
  <div id="resizer"></div>
</aside>

<main>
  <section class="view" id="libView">
    <div id="top">
      <label class="search"><span data-icon="search"></span><input id="q" type="search" autofocus spellcheck="false"></label>
      <span id="count"></span>
      <select id="sort" data-i18n-title="sortBy">
        <option value="usage" data-i18n="sortUsage"></option><option value="name" data-i18n="sortName"></option>
        <option value="duration" data-i18n="sortDuration"></option><option value="recent" data-i18n="sortRecent"></option>
      </select>
    </div>
    <div id="tableWrap">
      <table>
        <thead><tr><th class="c-fav"></th><th data-i18n="colFile"></th><th data-i18n="colDesc"></th><th class="c-cat" data-i18n="colCat"></th><th class="c-dur" data-i18n="colDur"></th><th class="c-fmt" data-i18n="colFmt"></th><th class="c-size" data-i18n="colSize"></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty"><div data-i18n="empty"></div><button class="btn" id="emptyAdd"><span data-icon="plus"></span><span data-i18n="addFolder"></span></button></div>
    </div>

    <section id="bottom">
      <div id="player">
        <div id="ctrl">
          <button id="play" data-i18n-title="space" data-icon="play"></button>
          <span id="time">0:00</span>
          <span id="curName"></span>
          <span id="regionInfo"></span>
          <!-- small icon toggles; the hidden inputs keep the state (preload reads minDrag/stayMin) -->
          <div class="toggles">
            <button class="ibtn" id="loop" data-i18n-title="loopTitle" data-icon="repeat"></button>
            <button class="ibtn tg" data-for="auto" data-i18n-title="autoTitle" data-icon="autoplay"></button>
            <button class="ibtn tg" data-for="minDrag" data-i18n-title="minDragTitle" data-icon="eyeOff"></button>
            <button class="ibtn tg" data-for="stayMin" data-i18n-title="stayMinTitle" data-icon="minimize"></button>
            <input type="checkbox" id="auto" checked hidden><input type="checkbox" id="minDrag" checked hidden><input type="checkbox" id="stayMin" hidden>
          </div>
          <div class="vol">
            <button class="ibtn" id="mute" data-i18n-title="volume" data-icon="volume"></button>
            <input type="range" id="vol" min="0" max="100" step="1" value="80"><span id="volVal">80%</span>
          </div>
          <div id="dragOut" draggable="true" data-i18n-title="dragOutTitle"><span data-icon="grip"></span><span data-icon="arrowRight"></span></div>
        </div>
        <div id="wave"></div>
      </div>
      <div id="meta">
        <label><span data-i18n="description"></span><input id="m-description" spellcheck="false"></label>
        <label><span data-i18n="category"></span><input id="m-category" spellcheck="false"></label>
        <label><span data-i18n="keywords"></span><input id="m-keywords" spellcheck="false"></label>
        <div class="actions">
          <button class="ibtn" id="saveDb" data-i18n-title="save" data-icon="check"></button>
          <button class="ibtn" id="saveFile" data-i18n-title="writeFilesTitle" data-icon="fileDown"></button>
          <div id="metaStatus"></div>
        </div>
      </div>
    </section>
  </section>

  <!-- web sound search: results read from a hidden tab of the chosen site, shown in the app's own list -->
  <section class="view" id="netView" hidden>
    <div class="ntop">
      <label class="search"><span data-icon="search"></span><input id="nq" type="search" spellcheck="false"></label>
      <div id="nsrcs"></div>
      <!-- YouTube only: words added to every search, so results are sound effects, not random videos -->
      <span id="ytSuf" hidden><button class="ibtn sm" id="ytSufOn" data-icon="plus"></button><input id="ytSufText" spellcheck="false"></span>
      <span id="ncount"></span>
      <button class="ibtn" id="nFolder" data-icon="folder"></button>
    </div>
    <!-- album page: our own header, then the album's sounds in the same list -->
    <div id="nAlbum" hidden>
      <button class="ibtn" id="naBack" data-i18n-title="netBack" data-icon="arrowLeft"></button>
      <div class="na-head">
        <div id="naCover"></div>
        <div class="na-info">
          <div class="na-kind"><span id="naSrc"></span><span data-i18n="netPack"></span></div>
          <div id="naTitle"></div>
          <div class="na-meta"><span id="naArtist"></span><span id="naCount"></span></div>
        </div>
      </div>
    </div>
    <div id="nWrap">
      <table>
        <thead><tr><th class="c-play"></th><th class="c-cover"></th><th data-i18n="colFile"></th><th class="c-ncat" data-i18n="colCat"></th><th class="c-dur" data-i18n="colDur"></th><th class="c-dl"></th></tr></thead>
        <tbody id="nrows"></tbody>
      </table>
      <div id="nMsg"></div>
      <div id="nMoreWrap"><button class="btn" id="nMore" data-i18n="netMore"></button></div>
    </div>
  </section>
</main>
<div id="toasts"></div>
<div id="engine"></div>

<script src="node_modules/wavesurfer.js/dist/wavesurfer.min.js"></script>
<script src="node_modules/wavesurfer.js/dist/plugins/regions.min.js"></script>
<script src="icons.js"></script>
<script src="renderer.js"></script>
</body>
</html>

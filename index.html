<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' sfx: blob:; connect-src sfx:; img-src 'self' data: https:; frame-src https: http:; style-src 'self' 'unsafe-inline'">
<title>SFX Library</title>
<script src="boot.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="titlebar">
  <span class="logo" data-icon="wave"></span><span class="name">SFX Library</span><span class="sub" id="ver"></span>
  <button class="btn primary" id="updateBtn" hidden></button>
</header>

<aside id="side">
  <div class="side-scroll">
    <div id="nav">
      <div class="item" data-view="all"><span class="tw"></span><span class="ic" data-icon="wave"></span><span class="lbl" data-i18n="allSounds"></span></div>
      <div class="item" data-view="fav"><span class="tw"></span><span class="ic" data-icon="star"></span><span class="lbl" data-i18n="favorites"></span></div>
      <div class="item" data-view="net"><span class="tw"></span><span class="ic" data-icon="globe"></span><span class="lbl" data-i18n="netNav"></span></div>
    </div>
    <div class="ph"><span data-i18n="libraries"></span><span class="ph-btns">
      <button class="ibtn sm" id="rescan" data-i18n-title="rescanAll" data-icon="refresh"></button>
      <button class="ibtn sm" id="add" data-i18n-title="addFolder" data-icon="plus"></button></span></div>
    <div id="libs"></div>
  </div>
  <div class="item" data-view="settings" id="settingsNav"><span class="tw"></span><span class="ic" data-icon="settings"></span><span class="lbl" data-i18n="settings"></span></div>
  <div id="scanStatus"></div>
  <div id="resizer"></div>
</aside>

<main>
  <section class="view" id="libView">
    <div id="top">
      <label class="search"><span data-icon="search"></span><input id="q" type="search" autofocus spellcheck="false"></label>
      <span id="count"></span>
      <select id="sort" data-i18n-title="sortBy">
        <option value="usage" data-i18n="sortUsage"></option><option value="name" data-i18n="sortName"></option>
        <option value="duration" data-i18n="sortDuration"></option><option value="recent" data-i18n="sortRecent"></option>
      </select>
    </div>
    <div id="tableWrap">
      <table>
        <thead><tr><th class="c-fav"></th><th data-i18n="colFile"></th><th data-i18n="colDesc"></th><th class="c-cat" data-i18n="colCat"></th><th class="c-dur" data-i18n="colDur"></th><th class="c-fmt" data-i18n="colFmt"></th><th class="c-size" data-i18n="colSize"></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty"><div data-i18n="empty"></div><button class="btn" id="emptyAdd"><span data-icon="plus"></span><span data-i18n="addFolder"></span></button></div>
    </div>

    <!-- the player panel: only the essentials; everything else lives in Settings -->
    <section id="bottom">
      <div id="player">
        <div id="ctrl">
          <button id="play" data-i18n-title="space" data-icon="play"></button>
          <span id="time">0:00</span>
          <span id="curName"></span>
          <span id="regionInfo"></span>
          <button class="ibtn" id="loop" data-i18n-title="loopTitle" data-icon="repeat"></button>
          <div class="vol">
            <button class="ibtn" id="mute" data-i18n-title="volume" data-icon="volume"></button>
            <input type="range" id="vol" min="0" max="100" step="1" value="80"><span id="volVal">80%</span>
          </div>
          <div id="dragOut" draggable="true" data-i18n-title="dragOutTitle"><span data-icon="grip"></span><span data-icon="arrowRight"></span></div>
        </div>
        <div id="wave"></div>
      </div>
      <div id="meta">
        <label><span data-i18n="description"></span><input id="m-description" spellcheck="false"></label>
        <label><span data-i18n="category"></span><input id="m-category" spellcheck="false"></label>
        <label><span data-i18n="keywords"></span><input id="m-keywords" spellcheck="false"></label>
        <div class="actions">
          <button class="ibtn" id="saveDb" data-i18n-title="save" data-icon="check"></button>
          <button class="ibtn" id="saveFile" data-i18n-title="writeFilesTitle" data-icon="fileDown"></button>
          <div id="metaStatus"></div>
        </div>
      </div>
    </section>
  </section>

  <!-- web sound search: results read from a hidden tab of the chosen site, shown in the app's own list -->
  <section class="view" id="netView" hidden>
    <div class="ntop">
      <label class="search"><span data-icon="search"></span><input id="nq" type="search" spellcheck="false"></label>
      <div id="nsrcs"></div>
      <!-- shown only when the chosen site supports an account and it is not connected yet -->
      <button class="btn" id="nLogin" hidden><span data-icon="user"></span><span id="nLoginLbl"></span></button>
      <span id="ncount"></span>
    </div>
    <!-- album page: our own header, then the album's sounds in the same list -->
    <div id="nAlbum" hidden>
      <button class="ibtn" id="naBack" data-i18n-title="netBack" data-icon="arrowLeft"></button>
      <div class="na-head">
        <div id="naCover"></div>
        <div class="na-info">
          <div class="na-kind"><span id="naSrc"></span><span id="naKind"></span></div>
          <div id="naTitle"></div>
          <div class="na-meta"><span id="naArtist"></span><span id="naCount"></span></div>
        </div>
      </div>
    </div>
    <div id="nWrap">
      <table>
        <thead><tr><th class="c-play"></th><th class="c-cover"></th><th data-i18n="colFile"></th><th class="c-ncat" data-i18n="colCat"></th><th class="c-dur" data-i18n="colDur"></th><th class="c-dl"></th></tr></thead>
        <tbody id="nrows"></tbody>
      </table>
      <div id="nMsg"></div>
      <div id="nMoreWrap"><button class="btn" id="nMore" data-i18n="netMore"></button></div>
    </div>
  </section>

  <!-- settings -->
  <section class="view" id="setView" hidden>
    <div class="set-wrap">
      <h1 data-i18n="settings"></h1>

      <h2 data-i18n="setLook"></h2>
      <div class="set-row"><div class="set-k"><b data-i18n="themeTitle"></b></div>
        <div class="seg" id="themeSeg">
          <button data-theme="system"><span data-icon="monitor"></span><span data-i18n="themeSystem"></span></button>
          <button data-theme="light"><span data-icon="sun"></span><span data-i18n="themeLight"></span></button>
          <button data-theme="dark"><span data-icon="moon"></span><span data-i18n="themeDark"></span></button>
        </div></div>
      <div class="set-row"><div class="set-k"><b data-i18n="language"></b></div>
        <select id="lang"><option value="auto" data-i18n="langAuto"></option><option value="ru">Русский</option><option value="en">English</option></select></div>

      <h2 data-i18n="setPlay"></h2>
      <label class="set-row"><div class="set-k"><b data-i18n="autoTitle"></b><span data-i18n="autoDesc"></span></div><span class="sw"><input type="checkbox" id="auto" checked><i></i></span></label>
      <label class="set-row"><div class="set-k"><b data-i18n="normTitle"></b><span data-i18n="normDesc"></span></div><span class="sw"><input type="checkbox" id="norm" checked><i></i></span></label>

      <h2 data-i18n="setDrag"></h2>
      <label class="set-row"><div class="set-k"><b data-i18n="minDrag"></b><span data-i18n="minDragTitle"></span></div><span class="sw"><input type="checkbox" id="minDrag" checked><i></i></span></label>
      <label class="set-row"><div class="set-k"><b data-i18n="stayMin"></b><span data-i18n="stayMinTitle"></span></div><span class="sw"><input type="checkbox" id="stayMin"><i></i></span></label>
      <div class="set-row"><div class="set-k"><b data-i18n="premiere"></b><span data-i18n="premiereDesc"></span></div>
        <div class="set-v"><span class="chip" id="premiereChip"></span><button class="btn" id="premiereBtn" data-i18n="premiereInstall"></button></div></div>

      <h2 data-i18n="setDl"></h2>
      <div class="set-row"><div class="set-k"><b data-i18n="dlFolder"></b><span id="dlFolderPath" class="path"></span></div>
        <div class="set-v"><button class="ibtn" id="dlFolderOpen" data-i18n-title="openFolder" data-icon="external"></button><button class="btn" id="dlFolderPick" data-i18n="change"></button></div></div>
      <div class="set-row"><div class="set-k"><b data-i18n="dlNames"></b><span data-i18n="dlNamesDesc"></span></div>
        <div class="seg" id="nameSeg">
          <button data-name="site" data-i18n="dlNameSite"></button>
          <button data-name="ask" data-i18n="dlNameAsk"></button>
        </div></div>

      <h2>YouTube</h2>
      <div class="set-row"><div class="set-k"><b data-i18n="ytSufLabel"></b><span data-i18n="ytSufTitle"></span></div>
        <div class="set-v"><input id="ytSufText" spellcheck="false"><span class="sw"><input type="checkbox" id="ytSufOn"><i></i></span></div></div>
    </div>
  </section>
</main>

<!-- asked on download when "ask for a name" is on: name + where (recent project folders) -->
<div id="dlDialog" hidden>
  <div class="dlg">
    <div class="dlg-h" data-i18n="dlTitle"></div>
    <label><span data-i18n="dlName"></span><input id="dlName" spellcheck="false"></label>
    <label><span data-i18n="dlWhere"></span><select id="dlWhere"></select></label>
    <div class="dlg-b"><button class="btn" id="dlCancel" data-i18n="cancel"></button><button class="btn primary" id="dlOk" data-i18n="save"></button></div>
  </div>
</div>
<div id="toasts"></div>
<div id="engine"></div>

<script src="node_modules/wavesurfer.js/dist/wavesurfer.min.js"></script>
<script src="node_modules/wavesurfer.js/dist/plugins/regions.min.js"></script>
<script src="icons.js"></script>
<script src="renderer.js"></script>
</body>
</html>

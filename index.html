<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' sfx: blob:; connect-src sfx:; style-src 'self' 'unsafe-inline'">
<title>SFX Library</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="titlebar"><span class="logo"></span><span class="name">SFX Library</span><span class="sub" id="ver"></span>
  <button id="updateBtn" hidden></button>
  <select id="lang" data-i18n-title="language"><option value="auto" data-i18n="langAuto"></option><option value="ru">Русский</option><option value="en">English</option></select></header>
<aside id="side">
  <div class="ph" data-i18n="libraries"></div>
  <div id="libs"></div>
  <div class="item" data-view="fav" data-i18n="favorites"></div>
  <div class="actions">
    <button id="add" data-i18n="addFolder"></button>
    <button id="rescan" data-i18n-title="rescanAll">⟳</button>
  </div>
  <div id="scanStatus"></div>
</aside>

<main>
  <div id="top">
    <input id="q" type="search" placeholder="rain heavy roof" autofocus>
    <span id="count"></span>
  </div>
  <div id="tableWrap">
    <table>
      <thead><tr><th class="c-fav"></th><th data-i18n="colFile"></th><th data-i18n="colDesc"></th><th class="c-cat" data-i18n="colCat"></th><th class="c-dur" data-i18n="colDur"></th><th class="c-fmt" data-i18n="colFmt"></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" data-i18n="empty"></div>
  </div>

  <section id="bottom">
    <div id="player">
      <div id="ctrl">
        <button id="play" data-i18n-title="space">▶</button>
        <label data-i18n-title="autoTitle"><input type="checkbox" id="auto" checked> <span data-i18n="auto"></span></label>
        <label data-i18n-title="minDragTitle"><input type="checkbox" id="minDrag" checked> <span data-i18n="minDrag"></span></label>
        <label data-i18n-title="stayMinTitle"><input type="checkbox" id="stayMin"> <span data-i18n="stayMin"></span></label>
        <span id="time">0:00</span>
        <span id="curName"></span>
        <span data-i18n-title="volume">🔊</span><input type="range" id="vol" min="0" max="100" step="1" value="80"><span id="volVal">80%</span>
        <div id="dragOut" draggable="true" data-i18n-title="dragOutTitle" data-i18n="dragOut"></div>
      </div>
      <div id="wave"></div>
    </div>
    <div id="meta">
      <label><span data-i18n="description"></span><input id="m-description"></label>
      <label><span data-i18n="category"></span><input id="m-category"></label>
      <label><span data-i18n="keywords"></span><input id="m-keywords"></label>
      <div class="actions">
        <button id="saveDb" data-i18n="save"></button>
        <button id="saveFile" data-i18n="writeFiles" data-i18n-title="writeFilesTitle"></button>
      </div>
      <div id="metaStatus"></div>
    </div>
  </section>
</main>
<script src="node_modules/wavesurfer.js/dist/wavesurfer.min.js"></script>
<script src="node_modules/wavesurfer.js/dist/plugins/regions.min.js"></script>
<script src="renderer.js"></script>
</body>
</html>
